<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AutoShorts Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1216'/%3E%3Cpath d='M13 10.5v11l9-5.5z' fill='%23E5A93D'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">▶</span>
        <div class="brand-text">
          <strong>AutoShorts Hub</strong>
          <small id="brand-sub">pasif gelir merkezi</small>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a href="#/panel" data-view="panel">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-12h8V3h-8v6z"/></svg>
          <span>Panel</span>
        </a>
        <a href="#/kanallar" data-view="kanallar">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 4.9 18.7l-.8-1.8A8 8 0 1 1 20 12v1.2c0 1-.7 1.8-1.6 1.8s-1.6-.8-1.6-1.8V12a4.8 4.8 0 1 0-1.4 3.4 3.5 3.5 0 0 0 6-2.2V12A10 10 0 0 0 12 2zm0 12.8a2.8 2.8 0 1 1 2.8-2.8 2.8 2.8 0 0 1-2.8 2.8z"/></svg>
          <span>Kanallar</span>
        </a>
        <a href="#/icerikler" data-view="icerikler">
          <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm4 4.5v7l6-3.5-6-3.5z" fill-rule="evenodd"/></svg>
          <span>İçerikler</span>
        </a>
        <a href="#/plan" data-view="plan">
          <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 9h14v11H5V9z"/></svg>
          <span>Yayın Planı</span>
        </a>
        <a href="#/ayarlar" data-view="ayarlar">
          <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0-.5 0-1-.1-1.5l2-1.6-2-3.4-2.4 1a7.8 7.8 0 0 0-2.6-1.5L15.9 2h-4l-.4 2.5a7.8 7.8 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a8.7 8.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.8 7.8 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.8 7.8 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6c.1-.5.1-1 .1-1.5z"/></svg>
          <span>Ayarlar</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="pulse" id="pulse"><span class="dot"></span><span id="pulse-text">bağlanıyor…</span></div>
        <button class="btn ghost small" id="logout-btn" hidden>Çıkış</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Panel</h1>
        <div class="topbar-right">
          <span class="chip" id="chip-api" title="YouTube Data API anahtarı">API anahtarı yok</span>
          <span class="chip" id="chip-oauth" title="Video yüklemek için OAuth istemcisi">OAuth yok</span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="login" class="login-wrap hidden">
    <form class="login-card" id="login-form">
      <span class="brand-mark big">▶</span>
      <h1>AutoShorts Hub</h1>
      <p>Devam etmek için parolayı girin.</p>
      <input type="password" id="login-password" placeholder="Parola" autocomplete="current-password" autofocus>
      <button class="btn primary block" type="submit">Giriş yap</button>
    </form>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
